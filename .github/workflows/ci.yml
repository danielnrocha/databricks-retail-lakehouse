name: CI

on:
  pull_request:
  push:
    branches: [main]

# A pull request that supersedes an in-flight run should cancel it. CI minutes spent on a
# commit nobody will merge are pure waste.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  # Fast gates first. Ordering is deliberate: the cheapest check that can fail the build runs
  # first, so a formatting mistake does not cost a Spark session start.
  static:
    name: Lint · types · traceability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install
        run: |
          uv venv .venv --python ${{ env.PYTHON_VERSION }}
          VIRTUAL_ENV=.venv uv pip install -e ".[local-spark,data,ml,dev]"

      - name: Traceability gate
        run: python3 scripts/check_traceability.py

      - name: Lint
        run: |
          .venv/bin/ruff format --check src tests generator scripts
          .venv/bin/ruff check src tests generator scripts

      - name: Types
        run: .venv/bin/mypy src scripts

  unit:
    name: Unit tests (no workspace)
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: |
          uv venv .venv --python ${{ env.PYTHON_VERSION }}
          VIRTUAL_ENV=.venv uv pip install -e ".[local-spark,data,ml,dev]"

      # ENV-006: this job has no DATABRICKS_* secrets in scope, by design. If a unit test starts
      # needing a workspace it will fail here rather than quietly becoming an integration test.
      - name: Unit tests
        run: .venv/bin/pytest tests/unit -m unit --cov=src --cov-report=term-missing

  bundle:
    name: Bundle validate
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v4

      - uses: databricks/setup-cli@main

      # Validation is offline for schema and reference errors; it catches the majority of
      # bundle mistakes without needing credentials on a fork PR.
      - name: Validate dev target
        run: databricks bundle validate -t dev
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        continue-on-error: true
