[project]
name = "retail-lakehouse"
version = "0.1.0"
description = "Retail lakehouse and agentic data platform on Databricks — spec-driven, test-enforced."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11,<3.13"

# Pinned to <3.13 deliberately. Databricks serverless and current DBR images run Python 3.12;
# developing on 3.13 locally would let syntax and stdlib behaviour through that fails on the
# platform. The local interpreter should track the deployment target, not the newest release.

dependencies = [
    "databricks-sdk>=0.68",
    "databricks-labs-dqx>=0.10",
    "mlflow>=3.6",
    "pyyaml>=6.0",
    "pydantic>=2.9",
]

[project.optional-dependencies]

# Local Spark for unit tests. Runs with no workspace connection (ENV-006).
local-spark = [
    "pyspark==3.5.6",
    "chispa>=0.10",
    "delta-spark==3.2.1",
]

# Databricks Connect for integration work against the real workspace.
#
# IMPORTANT: databricks-connect and pyspark install the same `pyspark` module and CANNOT coexist
# in one environment. This is not a packaging quirk to work around — it is why the two are separate
# extras and why `make test-unit` and `make test-integration` use different virtualenvs.
# Installing both produces a Spark session that silently behaves like neither.
dbconnect = [
    "databricks-connect~=17.0",
]

data = [
    "pandas>=2.2",
    "pyarrow>=17.0",
    "numpy>=2.0",
]

ml = [
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
]

# SHAP is deliberately absent. It pulls numba -> llvmlite, and the resolver lands on an
# llvmlite pinned to Python <3.10, which breaks the whole environment on 3.12. Taking a fragile
# transitive dependency for explainability we do not need yet is a bad trade; LightGBM's native
# gain importance plus sklearn's permutation_importance cover the requirement with zero new deps.
# Revisit only if a stakeholder asks for per-prediction attributions.

agents = [
    # The Databricks SDK talks to serving endpoints through an OpenAI-compatible client, so the
    # openai package is a transport dependency here, not a provider choice — the models served are
    # Databricks-hosted (gpt-oss, llama, qwen).
    "openai>=1.60",
]

dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retail_lakehouse"]

# ---------------------------------------------------------------------------
# Lint / format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "generator", "scripts"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # import sorting
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "A",         # builtin shadowing
    "C4",        # comprehensions
    "SIM",       # simplify
    "PTH",       # prefer pathlib
    "RUF",
]
ignore = [
    # Spark DataFrame code reads better with chained method calls that exceed the line budget
    # only in string SQL literals; those are formatted for readability, not for the linter.
    "E501",
    # Ambiguous-unicode checks. This repository uses real typography deliberately — em dashes in
    # prose, × in generated measurement tables. The rule exists to catch homoglyph attacks in
    # identifiers, which is a real concern; it is noise in docstrings and markdown generators.
    "RUF001", "RUF002", "RUF003",
    # `from pyspark.sql import functions as F` is the universal PySpark convention. Renaming it to
    # satisfy a naming rule would make every Spark example on the internet stop matching this
    # codebase, which is a worse outcome than an unconventional capital.
    "N812",
    # `X_train` / `X_test`. Capital X for the feature matrix and lowercase y for the target is the
    # notation every scikit-learn doc, paper and tutorial uses; it comes from the linear algebra,
    # not from carelessness. Renaming to `x_train` would make this codebase the odd one out.
    "N806",
]

[tool.ruff.lint.per-file-ignores]
# Tests assert on magic numbers by design — that is what a fixture-driven assertion looks like.
"tests/**" = ["S101", "PLR2004"]

# ---------------------------------------------------------------------------
# Types
# ---------------------------------------------------------------------------
[tool.mypy]
# 3.12, not 3.11. The venv, CI and Databricks serverless all run 3.12, and declaring 3.11 here
# made mypy reject numpy's own bundled stubs with "Type statement is only supported in Python 3.12
# and greater" -- a type checker failing on a dependency's stubs because we lied to it about the
# interpreter. The lower bound in requires-python stays 3.11 for installability; the checker
# should describe what we actually run.
python_version = "3.12"
strict = true
warn_unreachable = true

# Lakeflow pipeline modules are excluded because mypy structurally cannot analyse them: they
# import `pyspark.pipelines`, which exists only inside the Databricks runtime and is absent from
# the installed PySpark. Every error reported there is the checker failing to resolve a decorator
# it cannot see, not a defect in the code — ADR-0004 records this as one of the two real costs of
# the declarative framework.
#
# This is an exclusion of code the tool cannot check, NOT of code the tool dislikes. Everything
# importable stays strict. The distinction matters: the second kind of exclusion is how a type
# gate quietly stops gating.
exclude = "(^|/)(bronze|silver/pipeline|gold/pipeline)/"

# Third-party packages that ship no stubs and no py.typed marker. Listing them is not the same as
# disabling type checking: our own code is still strict, and a call into these is still checked
# against the annotations we write at the boundary. What is silenced is mypy complaining that
# someone else did not annotate their library.
[[tool.mypy.overrides]]
module = [
    "pyspark.*",
    "delta.*",
    "databricks.labs.dqx.*",
    "chispa.*",
    "pandas.*",
    "sklearn.*",
    "lightgbm.*",
    "pyarrow.*",
    "openai.*",
]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "unit: runs with no Databricks workspace connection",
    "integration: requires an authenticated Databricks workspace",
    "slow: takes more than 30 seconds",
]
