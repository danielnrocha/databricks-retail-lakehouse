# The medallion pipeline. The filename still says bronze; the graph no longer does.
#
# Free Edition allows ONE active pipeline per pipeline type per account. That is a hard
# constraint with no elegant workaround, and it shapes the design: bronze, silver and gold live
# in one pipeline graph rather than three independently schedulable ones. On a paid tier they
# would be split, because independent failure domains and independent schedules are worth real
# money — see docs/architecture/production-delta.md.
#
# One consequence is visible in `libraries` below and is worth naming: because everything shares
# a graph, a silver defect fails the bronze ingest too. That is the cost of the constraint, not a
# design preference, and pretending otherwise would misrepresent what this deployment proves.

resources:
  pipelines:
    dng_medallion:
      name: dng-medallion-${var.environment}

      # Serverless is not a choice here — Free Edition offers nothing else. Worth stating because
      # it removes every cluster-sizing lever the performance work would normally use, which is
      # itself a constraint the optimisation chapter has to work within rather than around.
      serverless: true
      photon: true

      catalog: ${var.catalog}
      schema: bronze

      # Continuous vs triggered. Triggered, deliberately: the streaming path's SLO is "minutes"
      # (ADR-0005), and a triggered pipeline on a short interval meets that at a fraction of the
      # cost of a permanently-running one. Choosing the loosest trigger that satisfies the SLO is
      # the engineering decision; choosing the tightest is a reflex.
      continuous: false
      development: true

      channel: CURRENT

      configuration:
        # The only route by which a catalog name reaches code (ENV-001).
        dng.catalog: ${var.catalog}
        dng.environment: ${var.environment}
        dng.events_landing: ${var.events_landing}
        dng.schema_location: ${var.events_landing}/_schema
        dng.sample_pct: ${var.sample_pct}
        # Seed volume holding the dunnhumby dimension sources. Composed from var.catalog rather
        # than declared as its own variable, so it cannot drift out of step with the environment
        # the rest of the pipeline writes to (ADR-0002).
        dng.seed: /Volumes/${var.catalog}/bronze/seed

      libraries:
        - glob:
            include: ../src/retail_lakehouse/bronze/**
        # `silver/pipeline/**`, not `silver/**`. The subdirectory exists purely so this glob can
        # exclude `silver/lib/`, which holds the pure Spark helpers the unit suite imports and
        # which must never be executed as part of the graph. Two API constraints force the shape:
        # single-asterisk patterns are rejected outright ("Use a double asterisk"), and a
        # `libraries` list may contain globs or explicit file entries but not both — so
        # enumerating the silver modules alongside the bronze glob is not available either.
        - glob:
            include: ../src/retail_lakehouse/silver/pipeline/**
        - glob:
            include: ../src/retail_lakehouse/gold/pipeline/**

      # Pipeline event log as a governed table rather than a UI-only artifact. Without this,
      # "what did the pipeline do last Tuesday?" is answerable only by clicking, and every
      # data-quality metric in NFR-3 would have to be reconstructed by hand.
      event_log:
        catalog: ${var.catalog}
        schema: ops
        name: pipeline_events
